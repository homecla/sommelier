# Builds the steam-webhelper fix (fixes/steam-webhelper) for Windows with mingw-w64.
# - every change: build and keep the files as a workflow artifact (for testing)
# - tag steam-webhelper-v*: build and publish them as a GitHub release, which sommelier downloads
# Actions are pinned to full commit SHAs; only the release job can write to the repository.
name: Steam webhelper fix

on:
  push:
    branches: [main]
    paths: ["fixes/steam-webhelper/**", ".github/workflows/steam-webhelper-fix.yml"]
    tags: ["steam-webhelper-v*"]
  workflow_dispatch:

# No permissions by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read   # check out the source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64

      - name: Build
        run: ./fixes/steam-webhelper/build.sh "$PWD/out"

      - name: Keep the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: steam-webhelper-fix
          path: out/

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/steam-webhelper-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release with the DLL
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: steam-webhelper-fix
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" out/winmm.dll out/SHA256SUMS --repo "$REPO" \
            --title "Steam webhelper fix ${TAG#steam-webhelper-}" \
            --notes "winmm.dll proxy that fixes the black Steam window under Wine on macOS. Built from ${SHA} by this workflow. Source: fixes/steam-webhelper. License: AGPL-3.0-or-later."
