# Builds the steam-webhelper fix (fixes/steam-webhelper) for Windows with mingw-w64.
# - every change: build and keep the files as a workflow artifact (for testing)
# - tag steam-webhelper-v*: build and publish them as a GitHub release, which sommelier downloads
name: Steam webhelper fix

on:
  push:
    branches: [main]
    paths: ["fixes/steam-webhelper/**", ".github/workflows/steam-webhelper-fix.yml"]
    tags: ["steam-webhelper-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64

      - name: Build
        run: ./fixes/steam-webhelper/build.sh "$PWD/out"

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: steam-webhelper-fix
          path: out/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/steam-webhelper-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/winmm.dll out/SHA256SUMS \
            --title "Steam webhelper fix ${GITHUB_REF_NAME#steam-webhelper-}" \
            --notes "winmm.dll proxy that fixes the black Steam window under Wine on macOS. Built from ${GITHUB_SHA} by this workflow. Source: fixes/steam-webhelper. License: AGPL-3.0-or-later."
